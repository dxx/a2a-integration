[project]
name = "a2a-integration"
version = "0.1.0"
description = "Implementation of A2A (Agent to Agent) protocol integration based on a2a-sdk"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=1.1.0",
    "sse-starlette>=3.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/a2a_common",
    "src/a2a_client",
    "src/a2a_server"
]

[tool.hatch.build.targets.sdist]
exclude = ["tests/"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]

examples = [
    "a2a-sdk[grpc]>=1.1.0",
    "langchain>=1.2.15",
    "langchain-openai>=1.2.1",
    "uvicorn>=0.46.0",
    "crewai>=1.14.7",
    "pydantic-ai>=1.0.0,<1.36.0",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
